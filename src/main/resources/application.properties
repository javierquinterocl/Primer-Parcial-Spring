spring.application.name=parcialspring

# Puerto (Railway asigna automáticamente, por defecto 8080 para localhost)
server.port=${PORT:8080}

# Configuracion de la base de datos PostgreSQL
# Para localhost con Supabase
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://aws-1-us-east-2.pooler.supabase.com:5432/postgres?sslmode=require}
spring.datasource.username=${DB_USERNAME:postgres.qutysjdohynjyqzzkqbk}
spring.datasource.password=${DB_PASSWORD:Unavacaconuniforme12}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuracion de Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Pool de Conexiones
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}

# Configuracion de jwt
jwt.secret=${JWT_SECRET:MiClaveSecretaParaJWT12345}
jwt.expirationMs=${JWT_EXPIRATION_MS:86400000}
jwt.tokenPrefix=Bearer
jwt.refreshExpirationMs=${JWT_REFRESH_EXPIRATION_MS:604800000}

# --- Otras configuraciones ---
spring.main.allow-bean-definition-overriding=${ALLOW_BEAN_OVERRIDE:false}

# Configuracion de Swagger/OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

